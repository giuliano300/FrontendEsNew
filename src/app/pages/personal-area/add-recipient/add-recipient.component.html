<app-ui-tour-restart (restart)="restartTour()" />

<div class="container">
    <div class="row">
        <div class="col md-12 text-center mt-4">
            <h1>{{inserisciModificaText | capitalize }}  un destinatario alla lista</h1>
            <p class="mt-2 textsize-4">
                Compila i campi del form e {{inserisciModificaText }}  destinatario nella rubrica.
            </p>
        </div>
    </div>
    <div class="generic-form mt-5 step-1">
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="flex-start">
                        RAGIONE SOCIALE / NOME E COGNOME <span class="required">*</span>
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{alertName}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="businessName" />
                </div>
                <div class="col-md-6">
                    <label class="flex-start">
                        COMPLETAMENTO NOMINATIVO
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{alertComplName}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="complementNames" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="flex-start">
                        INDIRIZZO <span class="required">*</span>
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{alertAddress}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="address" />
                </div>
                <div class="col-md-4">
                    <label class="flex-start">
                        COMPLETAMENTO INDIRIZZO
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{alertComplAddress}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="complementAddress" />
                </div>
                <div class="col-md-4">
                    <label>CAP <span class="required">*</span></label>
                    <input type="text" formControlName="zipCode" maxlength="5" />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-4">
                    <label>CITTÀ <span class="required">*</span></label>
                    <input type="text" formControlName="city" />
                </div>
                <div class="col-md-4">
                    <label class="flex-start">
                        PROVINCIA <span class="required">*</span>
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{alertProvince}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="province" maxlength="2" />
                </div>
                <div class="col-md-4">
                    <label class="flex-start">
                        STATO <span class="required">*</span>
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{alertState}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="state" />
                </div>
            </div>
            <div class="row mb-2">
                <div class="col-md-4">
                    <label class="flex-start">
                        CODICE FISCALE
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{infoCodiceFiscale}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="fiscalCode" />
                </div>
                <div class="col-md-4">
                    <label class="flex-start">
                        EMAIL
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{infoCodiceFiscale}}" placement="right"></i>
                    </label>
                    <input type="email" formControlName="email" />
                </div>
                <div class="col-md-4">
                    <label class="flex-start">
                        TELEFONO
                        <i class='bx bxs-info-square color-blue' ngbTooltip="{{infoCodiceFiscale}}" placement="right"></i>
                    </label>
                    <input type="text" formControlName="mobile" />
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                    <span class="required">* Campi obbligatori</span>
                </div>
            </div>

            <div class="group-button">
                <input type="submit" value="SALVA" class="bg-color-green color-white" />
            </div>

            <!-- ERRORE MOSTRATO SOLO DOPO SUBMIT -->
            <app-ui-alert [visible]="alertMessage" [message]="alertText" />
            

        </form>
    </div>
</div>
